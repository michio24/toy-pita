<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>トイ・ピタ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* Layout: one full-screen toy pegboard on a desk; HUD floats as chunky plastic trays above (stage/goals) and below (parts). Single committed light look. */
:root {
  color-scheme: light;
  --ink: #1f2b46;
  --ink-soft: #5a6a86;
  --panel: #ffffff;
  --panel-edge: #cfdde8;
  --sky: #c9dde3;
  --red: #e5483b; --red-d: #b1302a;
  --yellow: #f5c02f; --yellow-d: #c4931a;
  --blue: #2f7de1; --blue-d: #1f5bb0;
  --green: #2fae66; --green-d: #1f8049;
  --font-display: "Dela Gothic One", "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
  --r: 16px;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: relative; height: 100%; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font-family: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* ---------- top bar ---------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; pointer-events: none; transition: opacity .3s; z-index: 3; }
#topbar.dim { opacity: 0; }
#topbar > * { pointer-events: auto; }
.brand { font-family: var(--font-display); font-size: 26px; line-height: 1; display: flex; gap: 1px; padding: 9px 14px 10px; background: var(--panel); border-radius: var(--r); box-shadow: 0 4px 0 var(--panel-edge), 0 8px 18px rgba(31,43,70,.12); }
.brand span:nth-child(1) { color: var(--red); } .brand span:nth-child(2) { color: var(--yellow); text-shadow: 0 1px 0 var(--yellow-d); }
.brand span:nth-child(3) { color: var(--ink-soft); } .brand span:nth-child(4) { color: var(--blue); } .brand span:nth-child(5) { color: var(--green); }
.stagebox { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline; padding: 8px 14px; background: var(--panel); border-radius: var(--r); box-shadow: 0 4px 0 var(--panel-edge), 0 8px 18px rgba(31,43,70,.12); min-width: 0; }
#stageNum { font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; color: #fff; background: var(--ink); border-radius: 6px; padding: 3px 7px; align-self: center; grid-row: span 2; }
#stageName { font-weight: 900; font-size: 16px; }
#goalText { font-size: 12.5px; color: var(--ink-soft); font-weight: 700; }
#objectives { display: flex; gap: 6px; flex-wrap: wrap; align-self: center; }
.obj { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; padding: 6px 10px; background: rgba(255,255,255,.86); border-radius: 999px; color: var(--ink); transition: background .25s, color .25s, transform .25s; }
.obj svg { width: 14px; height: 14px; fill: var(--yellow); stroke: var(--yellow-d); stroke-width: 1.2; }
.obj .gi svg { width: 18px; height: 18px; fill: initial; stroke: none; display: block; }
.obj.goal { background: #fff; box-shadow: inset 0 0 0 2px #e4edf3; }
.obj.goal.done { background: var(--green); color: #fff; box-shadow: none; transform: scale(1.06); }
.obj b { font-variant-numeric: tabular-nums; color: var(--blue); }
.obj.goal.done b { color: #fff; }
.obj.bad b { color: var(--red); }
.obj.best { color: var(--yellow-d); letter-spacing: .05em; }
.tbtns { margin-left: auto; display: flex; gap: 8px; }
.ibtn { width: 44px; height: 44px; border: 0; border-radius: 14px; background: var(--panel); box-shadow: 0 4px 0 var(--panel-edge); display: grid; place-items: center; transition: transform .08s, box-shadow .08s; position: relative; }
.ibtn svg { width: 22px; height: 22px; }
.ibtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--panel-edge); }
.ibtn.off .wave { display: none; } .ibtn .mute { display: none; } .ibtn.off .mute { display: inline; }
#qualityBtn { width: auto; padding: 0 10px; gap: 4px; grid-auto-flow: column; font-size: 11.5px; font-weight: 900; }
#qualityBtn .bars { display: flex; gap: 2px; align-items: flex-end; height: 16px; }
#qualityBtn .bars i { width: 4px; border-radius: 2px; background: #d3dde6; }
#qualityBtn .bars i:nth-child(1) { height: 6px; } #qualityBtn .bars i:nth-child(2) { height: 11px; } #qualityBtn .bars i:nth-child(3) { height: 16px; }
#qualityBtn[data-q="low"] .bars i:nth-child(1), #qualityBtn[data-q="high"] .bars i:nth-child(-n+2), #qualityBtn[data-q="ultra"] .bars i { background: var(--green); }

/* ---------- chain counter ---------- */
#chain { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); display: flex; align-items: baseline; gap: 6px; padding: 6px 16px 8px; background: var(--ink); color: #fff; border-radius: 999px; z-index: 3; pointer-events: none; box-shadow: 0 6px 16px rgba(31,43,70,.25); }
#chain b { font-family: var(--font-display); font-weight: 400; font-size: 26px; color: var(--yellow); font-variant-numeric: tabular-nums; min-width: 1.2ch; text-align: center; }
#chain span { font-weight: 900; font-size: 13px; letter-spacing: .1em; }
#chain.bump b { animation: bump .35s cubic-bezier(.2,1.8,.4,1); }
@keyframes bump { 0% { transform: scale(1.7); } 100% { transform: none; } }

/* ---------- tray ---------- */
#tray { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 12px; align-items: flex-end; pointer-events: none; z-index: 3; transition: opacity .3s, transform .3s; }
#tray.dim { opacity: 0; transform: translateY(20px); }
#tray > * { pointer-events: auto; }
#parts { flex: 1; min-width: 0; display: flex; gap: 8px; overflow-x: auto; padding: 10px 10px 12px; background: var(--panel); border-radius: 20px; box-shadow: 0 5px 0 var(--panel-edge), 0 10px 24px rgba(31,43,70,.14); scrollbar-width: thin; transition: background .2s, opacity .2s; }
#tray.drop-back #parts { background: #ffe9e6; }
#tray.locked #parts { opacity: .55; pointer-events: none; }
.part { flex: 0 0 auto; width: 78px; display: grid; justify-items: center; gap: 1px; padding: 6px 4px 7px; border: 0; border-radius: 14px; background: #f1f6fa; box-shadow: 0 3px 0 #d7e3ec; position: relative; touch-action: none; transition: transform .08s, box-shadow .08s; }
.part:hover { background: #e7f0f7; }
.part:active { transform: translateY(2px); box-shadow: 0 1px 0 #d7e3ec; }
.part:disabled { opacity: .38; cursor: default; }
.part .ico svg { width: 40px; height: 40px; display: block; }
.pname { font-size: 11px; font-weight: 800; white-space: nowrap; }
.cnt { position: absolute; top: 3px; right: 5px; font-size: 11px; font-weight: 900; color: var(--blue); font-variant-numeric: tabular-nums; }
.actions { display: flex; gap: 8px; align-items: flex-end; }
.sbtn { height: 44px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--panel); box-shadow: 0 4px 0 var(--panel-edge); font-weight: 800; font-size: 13px; white-space: nowrap; }
.sbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--panel-edge); }
.sbtn.on { background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-d); }
.bigbtn { height: 64px; min-width: 150px; padding: 0 22px; border: 0; border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-size: 20px; color: #fff; transition: transform .08s, box-shadow .08s; }
.bigbtn svg { width: 24px; height: 24px; fill: currentColor; }
.bigbtn.go { background: var(--green); box-shadow: 0 6px 0 var(--green-d), 0 12px 24px rgba(31,128,73,.3); }
.bigbtn.stop { background: var(--red); box-shadow: 0 6px 0 var(--red-d), 0 12px 24px rgba(177,48,42,.3); }
.bigbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.bigbtn.pulse { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ---------- selection bar ---------- */
#selbar { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 2px; padding: 5px; background: var(--ink); border-radius: 14px; box-shadow: 0 6px 18px rgba(31,43,70,.3); z-index: 5; }
#selName { color: #cfe0f5; font-size: 11.5px; font-weight: 800; padding: 0 6px 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#selbar button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #fff; display: grid; place-items: center; }
#selbar button:hover { background: rgba(255,255,255,.14); }
#selbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
#selbar #delB { color: #ff9a90; }
#selbar #powB { width: auto; min-width: 44px; padding: 0 8px; font: 800 12px 'M PLUS Rounded 1c', sans-serif; color: #fff; }
#selbar #powB.on { color: #7be0a4; } #selbar #powB.off { color: #ff9a90; }
#selbar #noteB { width: auto; min-width: 40px; padding: 0 8px; font: 800 13px 'M PLUS Rounded 1c', sans-serif; color: var(--nc, #fff); white-space: nowrap; }

/* ---------- toast, banner, onomatopoeia ---------- */
#toast { position: absolute; left: 50%; top: 96px; transform: translate(-50%, -8px); max-width: min(600px, calc(100% - 32px)); padding: 10px 16px; background: var(--ink); color: #fff; border-radius: 14px; font-size: 14px; font-weight: 700; line-height: 1.55; text-align: center; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 6; text-wrap: balance; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#clearBanner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: clamp(64px, 14vw, 150px); color: var(--yellow); -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 var(--ink); pointer-events: none; z-index: 7; white-space: nowrap; letter-spacing: .02em; }
#clearBanner.show { animation: pop 1.6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.08) rotate(-5deg); opacity: 1; } 80% { transform: translate(-50%, -50%) scale(1) rotate(-5deg); opacity: 1; } 100% { transform: translate(-50%, -62%) scale(1) rotate(-5deg); opacity: 0; } }
.ono { position: absolute; font-family: var(--font-display); font-size: calc(30px * var(--s, 1)); color: var(--c); -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%) rotate(var(--rot)); animation: ono 1s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes ono { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(.3); } 18% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -60%) rotate(var(--rot)) scale(1); } 100% { opacity: 0; transform: translate(-50%, -95%) rotate(var(--rot)) scale(.95); } }

/* tutorial finger */
#finger { position: absolute; left: 0; top: 0; width: 46px; height: 46px; z-index: 6; pointer-events: none; }
#finger.go { animation: finger 2.4s ease-in-out infinite; }
#finger svg { width: 46px; height: 46px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
@keyframes finger { 0% { transform: translate(var(--x0), var(--y0)) scale(1); opacity: 0; } 12% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(.85); } 70% { transform: translate(var(--x1), var(--y1)) scale(.85); opacity: 1; } 85% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 1; } 100% { transform: translate(var(--x1), var(--y1)) scale(1); opacity: 0; } }

/* ---------- replay ---------- */
#replay { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#replay::before, #replay::after { content: ""; position: absolute; left: 0; right: 0; height: 9vh; background: #10141d; }
#replay::before { top: 0; } #replay::after { bottom: 0; }
.rec { position: absolute; top: calc(9vh + 14px); left: 18px; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); color: #fff; font-size: 18px; letter-spacing: .12em; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
.rec i { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
#replaySpeed { font-family: var(--font-body); font-weight: 900; font-size: 13px; letter-spacing: .1em; color: var(--yellow); }
#skipBtn { position: absolute; right: 18px; bottom: calc(9vh + 14px); pointer-events: auto; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: rgba(255,255,255,.92); font-weight: 800; }

/* ---------- modals ---------- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(31,43,70,.38); z-index: 8; }
.card { width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border-radius: 26px; box-shadow: 0 8px 0 var(--panel-edge), 0 20px 50px rgba(31,43,70,.3); padding: 22px 22px 20px; text-align: center; }
.card h2 { font-family: var(--font-display); font-size: 34px; margin: 0; color: var(--ink); font-weight: 400; }
#resStars { display: flex; justify-content: center; gap: 6px; margin: 12px 0 2px; }
.rstar svg { width: 64px; height: 64px; fill: #e4ebf1; stroke: #cfdde8; stroke-width: 1; }
.rstar.on svg { fill: var(--yellow); stroke: var(--yellow-d); animation: starIn .5s cubic-bezier(.2,1.8,.4,1) both; animation-delay: inherit; }
.rstar:nth-child(2) svg { width: 78px; height: 78px; margin-top: -10px; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: none; } }
#resRank { display: inline-block; margin: 2px 0 8px; padding: 4px 12px; border-radius: 999px; background: #fff4d2; color: #8a6200; font-weight: 900; font-size: 13px; letter-spacing: .06em; }
#resList { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; text-align: left; }
#resList li { display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; color: var(--ink-soft); padding: 8px 12px; background: #f4f8fb; border-radius: 12px; }
#resList li.ok { color: var(--ink); }
.tick { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #dfe7ee; color: #fff; font-size: 13px; font-weight: 900; flex: 0 0 auto; }
#resList li.ok .tick { background: var(--green); }
#resStats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0 16px; }
#resStats div { display: grid; gap: 2px; }
#resStats b { font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
#resStats small { font-size: 13px; margin-left: 2px; }
#resStats span { font-size: 11.5px; font-weight: 800; color: var(--ink-soft); letter-spacing: .06em; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row .sbtn { background: #f1f6fa; box-shadow: 0 4px 0 #d7e3ec; }
.row .bigbtn { height: 52px; min-width: 0; font-size: 17px; }
#stages .card { width: min(820px, 100%); text-align: left; }
.stHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
#stageGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.scard { display: grid; gap: 4px; align-content: start; text-align: left; padding: 12px 12px 10px; border: 0; border-radius: 18px; background: #f1f6fa; box-shadow: 0 4px 0 #d7e3ec; min-width: 0; }
.scard.current { background: #e4f0fd; box-shadow: 0 4px 0 #b9d4f4; }
.scard.sandbox { background: #fff6dc; box-shadow: 0 4px 0 #efdba0; }
.scard:active { transform: translateY(3px); box-shadow: 0 1px 0 #d7e3ec; }
.snum { font-family: var(--font-display); font-size: 11px; letter-spacing: .08em; color: var(--blue); }
.scard.sandbox .snum { color: var(--yellow-d); }
.sname { font-weight: 900; font-size: 16px; }
.sgoal { font-size: 12px; color: var(--ink-soft); font-weight: 700; line-height: 1.45; }
.sicons { display: flex; gap: 2px; flex-wrap: wrap; margin-top: 2px; }
.sicons i svg { width: 24px; height: 24px; display: block; }
.sstars { display: flex; gap: 2px; margin-top: 2px; }
.sstars i svg { width: 20px; height: 20px; fill: #dfe7ee; }
.sstars i.on svg { fill: var(--yellow); }
.sstars.free { font-size: 12px; font-weight: 800; color: var(--yellow-d); }

#fx { position: absolute; inset: 0; pointer-events: none; z-index: 9; overflow: hidden; }

@media (max-width: 1180px) { .brand { display: none; } #qualityLbl { display: none; } }
@media (max-width: 760px) {
  .brand { font-size: 20px; padding: 8px 11px; }
  #objectives { order: 5; width: 100%; }
  .obj { font-size: 11px; padding: 5px 8px; }
  .stagebox { flex: 1; }
  #goalText { font-size: 11.5px; }
  .part { width: 64px; } .part .ico svg { width: 32px; height: 32px; } .pname { font-size: 10px; }
  .bigbtn { min-width: 0; height: 58px; padding: 0 16px; font-size: 16px; }
  .bigbtn span { display: none; }
  .bigbtn svg { width: 28px; height: 28px; }
  #toast { top: 140px; font-size: 13px; }
  #chain { top: calc(env(safe-area-inset-top, 0px) + 120px); }
  #qualityLbl { display: none; }
}
@media (max-width: 480px) { .brand { display: none; } .tbtns { gap: 6px; } .ibtn { width: 40px; height: 40px; } #goalText { display: none; } #stageName { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; } .stagebox { grid-template-columns: auto minmax(0,1fr); } }
#rotateTip { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 130px); display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 0; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 800; font-size: 13px; text-align: left; z-index: 6; }
#rotateTip svg { width: 26px; height: 26px; flex: 0 0 auto; color: var(--yellow); }
#rotateTip span { flex: 1; min-width: 0; }
#rotateTip b { font-size: 18px; opacity: .7; }
@media (max-height: 520px) {
  #topbar { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); gap: 6px; }
  .brand, #goalText, #objectives { display: none; }
  .stagebox { flex: 0 1 auto; padding: 6px 10px; }
  #stageNum { grid-row: auto; }
  .ibtn { width: 38px; height: 38px; border-radius: 12px; } .ibtn svg { width: 19px; height: 19px; }
  #qualityLbl { display: none; }
  #tray { padding-top: 6px; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); gap: 8px; }
  #parts { padding: 6px; border-radius: 16px; gap: 6px; }
  .part { width: 54px; padding: 4px 2px; } .part .ico svg { width: 28px; height: 28px; } .pname { display: none; }
  .bigbtn { height: 50px; min-width: 0; padding: 0 14px; font-size: 15px; }
  .bigbtn span { display: none; }
  .sbtn { height: 38px; padding: 0 10px; font-size: 12px; }
  #toast { top: 56px; font-size: 12.5px; padding: 8px 12px; }
  #chain { top: calc(env(safe-area-inset-top, 0px) + 52px); padding: 4px 12px 5px; } #chain b { font-size: 20px; }
  .card { padding: 14px; } .card h2 { font-size: 26px; }
  .rstar svg { width: 44px; height: 44px; } .rstar:nth-child(2) svg { width: 52px; height: 52px; margin-top: -6px; }
  #resList { gap: 4px; } #resList li { padding: 5px 10px; font-size: 12.5px; }
  #resStats { margin: 8px 0 10px; } #resStats b { font-size: 20px; }
  .row .bigbtn { height: 44px; }
}
.row .bigbtn span { display: inline !important; }
@media (prefers-reduced-motion: reduce) { #clearBanner.show, .bigbtn.pulse, .rstar.on svg, .ono, #finger.go { animation-duration: .01s; } }

/* ---------- ドパ mode ---------- */
.dopaToggle { height: 44px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px 0 10px; border-radius: 14px; background: var(--panel); box-shadow: 0 4px 0 var(--panel-edge); cursor: pointer; font-family: var(--font-display); font-size: 15px; color: var(--ink); position: relative; }
.dopaToggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.dopaToggle .box { width: 22px; height: 22px; border-radius: 7px; border: 3px solid #c8d4de; background: #fff; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.dopaToggle input:checked + .box { border-color: transparent; background: conic-gradient(#ff3d7f, #ffb300, #3ddc84, #2fa7ff, #b44dff, #ff3d7f); }

<script>
// ===== トイ・ピタ core v2: parts, levels, geometry, physics (no rendering) =====
const DEG = Math.PI / 180;
const DT = 1 / 60;
const BOARD = { w: 18.2, h: 10.2, cx: 0, cy: 5.0, z: -0.72, pitch: 0.5 };
const FLOOR_Y = 0;
const STAGE = { xmin: BOARD.cx - BOARD.w / 2, xmax: BOARD.cx + BOARD.w / 2, ymin: Math.max(FLOOR_Y, BOARD.cy - BOARD.h / 2), ymax: BOARD.cy + BOARD.h / 2 };

// ---------- shape helpers ----------
const SC = (cx, cy, r) => ({ k: 'c', cx, cy, r });
const SB = (cx, cy, w, h, a) => ({ k: 'b', cx, cy, w, h, a: a || 0 });
const rotP = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

// quarter-pipe curve: arc centred (0.55,0.55), radius 1.1, 180°→270° (concave side faces up-right)
const CURVE_R = 1.1, CURVE_C = [0.55, 0.55], CURVE_N = 9;
const CURVE_FLARE = [CURVE_C[0] - CURVE_R - 0.2, CURVE_C[1] + 0.5];
function curvePoints(n, flare) { const pts = flare ? [CURVE_FLARE.slice()] : []; for (let i = 0; i <= n; i++) { const t = (180 + 90 * i / n) * DEG; pts.push([CURVE_C[0] + CURVE_R * Math.cos(t), CURVE_C[1] + CURVE_R * Math.sin(t)]); } return pts; }
const CURVE_FP = (() => { const p = curvePoints(CURVE_N, true), out = []; for (let i = 0; i < p.length - 1; i++) { const [x0, y0] = p[i], [x1, y1] = p[i + 1]; const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; const L = Math.hypot(x1 - x0, y1 - y0); const a = Math.atan2(y1 - y0, x1 - x0); let nx = -(y1 - y0) / L, ny = (x1 - x0) / L; if (nx * (CURVE_C[0] - mx) + ny * (CURVE_C[1] - my) < 0) { nx = -nx; ny = -ny; } out.push(SB(mx - nx * 0.07, my - ny * 0.07, L + 0.04, 0.14, a / DEG)); } return out; })();

const PEND_L = 1.7;
const CANNON_PIVOT = [0, 0.12];

  cannon:    { name: '大砲', rot: true, flip: true, selfRot: true, rotMin: -30, rotMax: 75,
               fp: (o) => { const a = (o.angle || 0) * DEG; const [bx, by] = rotP(0.3, 0, a); return [SB(-0.05, -0.2, 0.9, 0.44), SB(CANNON_PIVOT[0] + bx, CANNON_PIVOT[1] + by, 0.85, 0.34, o.angle || 0)]; } },
};

  { name: 'ド', f: 523.25, css: '#e5483b' }, { name: 'レ', f: 587.33, css: '#f08a2c' }, { name: 'ミ', f: 659.26, css: '#f5c02f' },

// ---------- Geometry (overlap tests for editing) ----------
function xform(o) { const a = PARTS[o.type].selfRot ? 0 : (o.angle || 0) * DEG; return { x: o.x, y: o.y, c: Math.cos(a), s: Math.sin(a), f: o.flip ? -1 : 1 }; }
function shapeWorld(sh, t) {
  const lx = sh.cx * t.f, ly = sh.cy;
  const wx = t.x + lx * t.c - ly * t.s, wy = t.y + lx * t.s + ly * t.c;
  if (sh.k === 'c') return { k: 'c', x: wx, y: wy, r: sh.r };
  const a = Math.atan2(t.s, t.c) + (sh.a || 0) * DEG * t.f;
  const c = Math.cos(a), s = Math.sin(a), hw = sh.w / 2, hh = sh.h / 2;
  const pts = [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([px, py]) => [wx + px * c - py * s, wy + px * s + py * c]);
  return { k: 'p', pts, x: wx, y: wy };
}
function objShapes(o) { const t = xform(o); return PARTS[o.type].fp(o).map(sh => shapeWorld(sh, t)); }
function terrainShape(tr) { return shapeWorld({ k: 'b', cx: 0, cy: 0, w: tr.w, h: tr.h }, { x: tr.x, y: tr.y, c: Math.cos((tr.a || 0) * DEG), s: Math.sin((tr.a || 0) * DEG), f: 1 }); }
function projPoly(pts, ax, ay) { let mn = Infinity, mx = -Infinity; for (const p of pts) { const d = p[0] * ax + p[1] * ay; if (d < mn) mn = d; if (d > mx) mx = d; } return [mn, mx]; }
function polyPoly(A, B, m) {
  for (const P of [A, B]) for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length]; let ax = -(q[1] - p[1]), ay = q[0] - p[0]; const L = Math.hypot(ax, ay); ax /= L; ay /= L;
    const [a0, a1] = projPoly(A, ax, ay), [b0, b1] = projPoly(B, ax, ay);
    if (a1 - m <= b0 || b1 - m <= a0) return false;
  }
  return true;
}
function circPoly(C, P, m) {
  let inside = true, best = Infinity;
  for (let i = 0; i < P.length; i++) {
    const p = P[i], q = P[(i + 1) % P.length]; const ex = q[0] - p[0], ey = q[1] - p[1];
    const cross = ex * (C.y - p[1]) - ey * (C.x - p[0]); if (cross < 0) inside = false;
    let t = ((C.x - p[0]) * ex + (C.y - p[1]) * ey) / (ex * ex + ey * ey); t = Math.max(0, Math.min(1, t));
    const d = Math.hypot(C.x - (p[0] + ex * t), C.y - (p[1] + ey * t)); if (d < best) best = d;
  }
  return inside || best < C.r - m;
}
function shapesHit(a, b, m = 0.025) {
  if (a.k === 'c' && b.k === 'c') return Math.hypot(a.x - b.x, a.y - b.y) < a.r + b.r - m;
  if (a.k === 'c') return circPoly(a, b.pts, m);
  if (b.k === 'c') return circPoly(b, a.pts, m);
  return polyPoly(a.pts, b.pts, m);
}
function shapeBounds(s) {
  if (s.k === 'c') return [s.x - s.r, s.y - s.r, s.x + s.r, s.y + s.r];
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const p of s.pts) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); } return [a, b, c, d];
}
function placeable(o, others, terrain, m = 0.025) {
  const mine = objShapes(o);
  for (const s of mine) { const [x0, y0, x1, y1] = shapeBounds(s); if (x0 < STAGE.xmin || x1 > STAGE.xmax || y0 < STAGE.ymin - 0.001 || y1 > STAGE.ymax) return false; }
  const ts = terrain.map(terrainShape);
  for (const s of mine) for (const t of ts) if (shapesHit(s, t, m)) return false;
  for (const ob of others) { if (ob === o) continue; const os = objShapes(ob); for (const s of mine) for (const t of os) if (shapesHit(s, t, m)) return false; }
  return true;
}
function pointHits(o, x, y, pad = 0.18) {
  for (const s of objShapes(o)) {
    if (s.k === 'c') { if (Math.hypot(s.x - x, s.y - y) < s.r + pad) return true; }
    else if (circPoly({ x, y, r: pad }, s.pts, 0)) return true;
  }

// Find a valid spot near (o.x,o.y): push up out of collisions; non-ball drop parts settle onto surfaces.
function settle(o, others, terrain) {
  const y0 = o.y;
  if (!placeable(o, others, terrain)) {
    let ok = false;
    for (let i = 1; i <= 24; i++) { o.y = y0 + i * 0.05; if (placeable(o, others, terrain)) { ok = true; break; } }
    if (!ok) { o.y = y0; return false; }
  }
  if (PARTS[o.type].drop) {
    if (!placeable(o, others, terrain, -0.003)) { for (let i = 0; i < 10 && !placeable(o, others, terrain, -0.003); i++) o.y += 0.005; }
    if (!PARTS[o.type].ball) {
      for (let i = 0; i < 14; i++) { o.y -= 0.05; if (!placeable(o, others, terrain, -0.003)) { o.y += 0.05; break; } }
      for (let i = 0; i < 10; i++) { o.y -= 0.005; if (!placeable(o, others, terrain, -0.003)) { o.y += 0.005; break; } }
    }
    // never let a part rest on a ball (it would just roll off and cheat the puzzle)
    const balls = others.filter(b => b !== o && PARTS[b.type].ball);
    if (balls.length) { o.y -= 0.03; const onBall = !placeable(o, balls, [], -0.003); o.y += 0.03; if (onBall) { o.y = y0; return false; } }
  }
  o.y = Math.round(o.y * 1000) / 1000;
  return true;
}
